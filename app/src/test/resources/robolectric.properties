# Faz 109 — Robolectric'in JVM testlerinde taklit ettigi Android surumu.
#
# Neden targetSdk (36) DEGIL:
#   Robolectric 4.16.1, Android SDK 36 sandbox'i icin Java 21 istiyor
#   ("Android SDK 36 requires Java 21 (have Java 17)"), bu makinedeki JDK ise 17.
#   Sirf test icin projenin toolchain'ini yukseltmek, uretim build'ini de
#   etkileyecek buyuk ve alakasiz bir degisiklik olurdu.
#
# 35 (Android 15) Java 17 ile sorunsuz calisiyor ve bu projenin desteklenen
# araligi icinde (minSdk 24 .. targetSdk 36) fazlasiyla temsil edici.
# JDK 21'e gecildiginde bu satir silinebilir; o zaman targetSdk otomatik kullanilir.
sdk=35
